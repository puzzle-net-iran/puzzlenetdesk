name: Flutter Nightly Build

on:
  # Nightly schedule disabled: nightly releases stole the "Latest" badge
  # from version releases in the repo sidebar. Run manually if needed.
  # schedule:
  #   # schedule build every night
  #   - cron: "0 0 * * *"
  workflow_dispatch:

# Same reason as puzzledesk-release.yml: the repo default token is
# contents: read, but the called flutter-build.yml jobs need contents: write.
permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
